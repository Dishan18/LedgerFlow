spring:
  application:
    name: ledgerflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerflow}
    username: ${DB_USERNAME:ledgerflow}
    password: ${DB_PASSWORD:ledgerflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-south-1}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  structured:
    format:
      console: ecs

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ledgerflow:
  security:
    # Overridden by JWT_SECRET (Secrets Manager in AWS). This default is for local use only.
    jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
  idempotency:
    retention: 24h
    cleanup-cron: "0 0 * * * *"
  bank:
    base-url: ${BANK_URL:http://localhost:8081}
    connect-timeout: 1s
    read-timeout: 2s
    max-retries: 2
    initial-backoff: 200ms
    max-backoff: 1s
  status-poller:
    enabled: true
    interval: 5s
    batch-size: 50
    first-check-after: 5s
    max-check-interval: 5m
    stuck-created-after: 1m
    not-found-grace: 2m
    max-pending-age: 30m
    lease: 1m
  outbox:
    enabled: true
    poll-interval: 500ms
    batch-size: 100
    topic-arn: ${PAYMENT_EVENTS_TOPIC_ARN:arn:aws:sns:ap-south-1:000000000000:payment-events}
  webhooks:
    queue: ${WEBHOOK_QUEUE:webhook-delivery}
    signing-secret-id: ${WEBHOOK_SIGNING_SECRET_ID:ledgerflow/webhook-signing-secret}
    secret-cache-ttl: 5m
    connect-timeout: 2s
    read-timeout: 5s
    # Must match maxReceiveCount in the queue's redrive policy (LocalStack init script / Terraform).
    max-attempts: 5
    initial-backoff: 10s
    max-backoff: 5m
  reconciliation:
    queue: ${SETTLEMENT_FILES_QUEUE:settlement-files}
    reports-bucket: ${SETTLEMENT_BUCKET:ledgerflow-settlements}
    reports-prefix: reports/
